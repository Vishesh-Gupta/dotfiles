# One tool list for every machine (macOS and Debian/Ubuntu, any user incl. root).
# Install or update everything with: mise install   (or: mise upgrade)
# Reference: https://mise.jdx.dev/configuration.html

[tools]
# --- Languages and runtimes ---
node = "lts"
python = "3.13"
go = "latest"
uv = "latest"

# --- Shell essentials ---
bat = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
ripgrep = "latest"
zoxide = "latest"
starship = "latest"

# --- Git ---
gh = "latest"
delta = "latest"
lazygit = "latest"

# --- Utilities ---
jq = "latest"
yq = "latest"
btop = "latest"
glow = "latest"
hyperfine = "latest"
tealdeer = "latest"
zellij = "latest"
shellcheck = "latest"

# AI tools come last: when two tools ship the same binary name (cursor-agent
# bundles its own `rg`), mise uses the one listed first.
# --- AI coding agents and CLIs ---
claude = "latest"            # Claude Code
codex = "latest"             # OpenAI Codex CLI
gemini-cli = "latest"        # Google Gemini CLI
copilot = "latest"           # GitHub Copilot CLI
opencode = "latest"
cursor-agent = "latest"
"pipx:llm" = "latest"        # Simon Willison's llm: prompts, embeddings, plugins from the shell
"pipx:aider-chat" = { version = "latest", uvx_args = "--python 3.12" }

[settings]
# Read .nvmrc, .python-version, etc. so existing projects just work.
idiomatic_version_file_enable_tools = ["node", "python", "go"]
# Install Python CLIs (pipx: tools) with uv.
pipx.uvx = true
