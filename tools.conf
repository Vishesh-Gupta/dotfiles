# Tool catalog for the setup menu (scripts/install.sh).
#
# Format: id | section | label | default | kind | spec
#   default: core = always installed (not in the menu), on = pre-selected, off = not
#   kind:    mise      -> spec is one or more mise tool lines, separated by ";".
#                         List a tool's dependencies too (e.g. node for npm-based
#                         agents); duplicates across selections are dropped.
#            rustup    -> official Rust installer (spec unused)
#            brew-cask -> macOS app via Homebrew (spec = cask name); hidden on Linux
#
# Add a tool: append a line, then run `dotfiles install` and tick it.

core     | Core         | Shell essentials                  | core | mise | fzf = "latest"; fd = "latest"; ripgrep = "latest"; bat = "latest"; eza = "latest"; zoxide = "latest"; starship = "latest"; delta = "latest"

claude   | AI agents    | Claude Code                       | on   | mise | claude = "latest"
