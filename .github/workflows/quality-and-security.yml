name: Quality and Security Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install scan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ripgrep zsh

      - name: Run test suite
        run: bash ./scripts/test.sh

      - name: Run security scan
        run: bash ./scripts/security-scan.sh

  # Full install on every supported platform: the same tools must land everywhere.
  full-install:
    name: full-install (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS runs the installer with the system /bin/bash 3.2, like a fresh Mac.
          - name: macos
            runs-on: macos-latest
            install: /bin/bash ./scripts/install.sh --yes
          - name: ubuntu
            runs-on: ubuntu-latest
            install: bash ./scripts/install.sh --all
          - name: debian-root
            runs-on: ubuntu-latest
            container: debian:stable
            install: bash ./scripts/install.sh --all
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    env:
      # Avoids GitHub API rate limits when mise resolves "latest" versions.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install
        run: ${{ matrix.install }}

      - name: Re-run with saved selection (idempotent)
        run: bash ./scripts/install.sh --yes

      - name: Verify tools from a fresh shell
        shell: bash
        run: |
          cd "$HOME"
          "$HOME/.local/bin/dotfiles" doctor
          # Non-interactive shells (what AI agents spawn) must see the tools too.
          zsh -c 'for c in claude gemini rg fd fzf node python uv gh cargo; do command -v "$c" >/dev/null || { echo "not on PATH: $c"; exit 1; }; done'
          bash -lc 'command -v claude && command -v rg'

  # The documented one-liner, against this branch.
  bootstrap:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      DOTFILES_REPO: ${{ github.repository }}
      DOTFILES_REF: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Bootstrap with wget
        run: wget -qO- "https://raw.githubusercontent.com/${DOTFILES_REPO}/${DOTFILES_REF}/scripts/bootstrap.sh" | bash -s -- --yes

      - name: Verify
        run: |
          test -f "$HOME/.dotfiles/scripts/install.sh"
          "$HOME/.local/bin/dotfiles" doctor
